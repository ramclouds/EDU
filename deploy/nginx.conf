# nginx for the school platform (single address per school).
# Replace example.com with your domain and the paths with your own.
# Test with `nginx -t` before reloading.
#
#   https://<tenant id>.example.com/Login          a school's sign-in page
#   https://<tenant id>.example.com/super-admin-dashboard/<user id>/...   dashboards
#   https://<tenant id>.example.com/y26/...        the API (version prefix)
#   https://<tenant id>.example.com/api/...        the API (no version)
#   https://example.com/Login                      the common sign-in page (no school)
#   https://portal.theirschool.edu/...             a verified custom domain (same layout)
#
# DNS:  A/AAAA for example.com and *.example.com -> this server.
# TLS:  one certificate for example.com and *.example.com (wildcards need DNS validation):
#       certbot certonly --dns-<provider> -d example.com -d '*.example.com'
# A custom domain needs its own certificate, added as its own server block.

upstream edu_backend {
    server 127.0.0.1:5000;          # gunicorn, see backend/gunicorn_conf.py
    keepalive 32;
}

# Plain HTTP goes to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Every school address, and the platform address: the web app and the API together.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com *.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Security headers for the web app. The app loads its own scripts and styles, the
    # school logos and images from the same address, and the fonts from Google Fonts.
    # Check the sign-in and dashboard pages after changing this.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;       # file, logo and sign-in image uploads

    root /var/www/edu/dist;         # output of `npm run build`

    # The API. The school is read from the Host header, so it MUST be passed on.
    location ~ ^/(y[0-9]{2}|api)/ {
        proxy_pass http://edu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files with long cache lifetimes (names change on every build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The web app. Every page (/Login, /super-admin-dashboard/ADM-…, …) is served
    # the same index.html, and the app shows the right page itself.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# A school's own domain (verified in the developer console): same layout as above.
# Copy this block once per custom domain, with its own certificate.
# server {
#     listen 443 ssl http2;
#     server_name portal.theirschool.edu;
#     ssl_certificate     /etc/letsencrypt/live/portal.theirschool.edu/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/portal.theirschool.edu/privkey.pem;
#     ... same location blocks as above ...
# }
